<title id="title">Favicon CONFIANÇA</title><desc id="desc">Símbolo isolado, fundo transparente.</desc>
<svg x="0" y="55" width="500" height="390" viewBox="0 0 500 390"><g id="simbolo-confianca" stroke-linejoin="round" stroke-linecap="round">
