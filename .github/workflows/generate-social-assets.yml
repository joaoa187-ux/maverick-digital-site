name: Generate Maverick social assets
on:
  push:
    branches:
      - chore/institutional-finish-rebrand
    paths-ignore:
      - assets/apple-touch-icon.png
      - assets/og-maverick.png
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/institutional-finish-rebrand
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg pillow
      - run: python scripts/generate_social_assets.py
      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png assets/og-maverick.png
          git commit -m "Add optimized social and Apple icon assets" || exit 0
          git push
